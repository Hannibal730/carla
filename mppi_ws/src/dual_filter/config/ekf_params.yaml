# =============================================================================
# Dual EKF parameters — REP-105 compliant
#   utm → odom  : global_ekf  (world_frame: utm)
#   odom → base_link : local_ekf (world_frame: odom)
#
# Topic remappings are handled in dual_filter.launch.py:
#   /imu/data  ←  /carla/car/imu/data
# =============================================================================

# -----------------------------------------------------------------------------
# Node 1: Local EKF  —  smooth, GNSS-free odometry for MPPI controller
#   Inputs : /wheel_encoder/data (vx, vy=0)  +  /imu/data (wz)
#   Output : /odometry/local  +  odom → base_link TF
# -----------------------------------------------------------------------------
local_ekf:
  ros__parameters:
    use_sim_time: true
    frequency: 50.0
    two_d_mode: true
    publish_tf: true

    map_frame:       utm
    odom_frame:      odom
    base_link_frame: base_link
    world_frame:     odom        # local EKF lives in odom frame

    # /wheel_encoder/data  — vx (linear.x) + non-holonomic vy=0 constraint
    # config: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    odom0: /wheel_encoder/data
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false

    # /imu/data  — angular velocity z (wz) + longitudinal acceleration (ax)
    # (orientation disabled: dual GNSS azimuth is used instead via global EKF)
    # ax(13번째)=true: IMU 종방향 선가속도로 vx 예측을 보강. ay/az는 vy=0 제약·2D모드와
    # 충돌하므로 false 유지. 이 설정은 global_ekf와 반드시 동일해야 한다 (아래 3번 노드 참고).
    # launch remapping: /imu/data ← /carla/car/imu/data
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  true,  false, false]
    imu0_queue_size: 10
    imu0_nodelay: true
    imu0_differential: false
    imu0_relative: false

# -----------------------------------------------------------------------------
# Node 3: Global EKF  —  GNSS drift correction, absolute position for path tracking
#   Inputs : /wheel_encoder/data (vx, vy=0)  +  /imu/data (wz)  +  /odometry/gnss (x, y, yaw)
#   Output : /odometry/global  +  utm → odom TF
# -----------------------------------------------------------------------------
global_ekf:
  ros__parameters:
    use_sim_time: true
    frequency: 50.0   # 30→50: controller 20Hz 주기(50ms) 안에 TF가 반드시 갱신되도록
    two_d_mode: true
    publish_tf: true

    map_frame:       utm
    odom_frame:      odom
    base_link_frame: base_link
    world_frame:     utm         # global EKF lives in utm frame → publishes utm→odom TF

    # /wheel_encoder/data  — vx (linear.x) + non-holonomic vy=0 constraint
    odom0: /wheel_encoder/data
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_queue_size: 10
    odom0_nodelay: true
    odom0_differential: false
    odom0_relative: false

    # /imu/data  — angular velocity z (wz) + longitudinal acceleration (ax)
    # local_ekf와 동일한 예측 모델 유지: 두 필터의 유일한 차이는 GNSS(odom1) 사용 여부뿐이다.
    # 따라서 ax 사용 여부도 local_ekf와 반드시 일치시킨다 (대칭).
    # launch remapping: /imu/data ← /carla/car/imu/data
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  true,  false, false]
    imu0_queue_size: 10
    imu0_nodelay: true
    imu0_differential: false
    imu0_relative: false

    # /odometry/gnss  — UTM absolute position (x, y) + azimuth yaw
    # correction stage: removes long-term drift accumulated in local EKF
    # odom1_config: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    odom1: /odometry/gnss
    odom1_config: [true,  true,  false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_queue_size: 10
    odom1_nodelay: true
    odom1_differential: false
    odom1_relative: false
