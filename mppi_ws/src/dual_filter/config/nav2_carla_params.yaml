# =============================================================================
# nav2_carla_params.yaml — Nav2 controller_server + MPPI + local_costmap
#
# 대상 차량 : vehicle.micro.microlino  (wheelbase ≈ 1.47 m, width ≈ 1.475 m)
# Nav2 버전 : 1.1.20 (Humble)
# TF tree  : map → odom → base_link  (REP-105, dual_filter 스택 출력)
#
# 실행 방법:
#   ros2 run nav2_controller controller_server \
#     --ros-args --params-file ~/carla/mppi/src/dual_filter/config/nav2_carla_params.yaml \
#     -p use_sim_time:=true
# =============================================================================

controller_server:
  ros__parameters:
    use_sim_time: true

    # ── 제어 루프 주파수 ──────────────────────────────────────────────────────
    # local_ekf 주파수(50 Hz)보다 반드시 낮게 설정해야 매 제어 주기마다
    # 최신 odometry를 수신할 수 있다.
    # 10 Hz → 100ms 예산. MPPI(batch 500 × step 40) + costmap 조회가
    # 간헐적으로 50ms(20Hz 예산)를 초과해 "Control loop missed" 경고 발생.
    # 10 Hz로 내리면 예산이 2배가 되어 스파이크를 흡수할 수 있다.
    # model_dt = 1 / controller_frequency 반드시 함께 수정.
    controller_frequency: 10.0           # Hz  (변경: 20→10)

    # ── odometry 소스 ─────────────────────────────────────────────────────────
    # /odometry/local : local EKF 출력 (wheel + IMU만 융합, GNSS 불포함)
    #   → GNSS 수신 불량 구간이나 멀티패스 오차에서도 MPPI 제어 루프가 안정적.
    #   → GNSS 수신 상태와 무관하게 고주파(50 Hz) odometry 보장.
    # /odometry/global 사용 시: GNSS 위치 도약(jump) 발생 구간에서
    #   MPPI가 오동작할 수 있으므로 local을 권장.
    odom_topic: /odometry/local

    # ── TF 변환 허용 지연 ────────────────────────────────────────────────────────
    # controller_server가 odom→map 변환 시 허용하는 TF 지연 시간.
    # CARLA sim time에서 global_ekf TF가 최대 50ms 지연 → 기본값 0.1s 초과 가능.
    # local_costmap의 transform_tolerance(0.5s)와 일치시켜 일관성 유지.
    transform_tolerance: 0.5

    # ── costmap 갱신 타임아웃 ─────────────────────────────────────────────────
    # costmap이 이 시간(s) 안에 갱신되지 않으면 controller_server가 실패 처리.
    # CARLA sim time에서 LiDAR 콜백 지연이 발생하므로 기본값 0.30 s 유지.
    costmap_update_timeout: 0.30

    # ── 정지 판정 임계값 ──────────────────────────────────────────────────────
    # 이 값 이하의 선속도/각속도는 "정지 상태"로 간주.
    # progress_checker가 차량 이동 여부를 판단할 때 사용.
    # 값이 너무 크면 느린 크리핑 주행도 "정지"로 오판할 수 있음.
    min_x_velocity_threshold: 0.001     # m/s
    min_theta_velocity_threshold: 0.001 # rad/s

    # ── 실패 허용 시간 ────────────────────────────────────────────────────────
    # 유효한 cmd_vel 을 이 시간(s) 동안 생성하지 못하면 실패 처리.
    # MPPI가 수렴하지 못하거나 costmap에 차량 위치가 없을 때 빠른 실패 감지.
    failure_tolerance: 1.5

    # ── 플러그인 목록 ─────────────────────────────────────────────────────────
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins:
      ["goal_checker", "first_parking_goal_checker", "parking_goal_checker"]
    controller_plugins:       ["FollowPath", "ParkingPath"]
    path_handler_plugins:     ["PathHandler"]

    # =========================================================================
    # progress_checker
    # 차량이 실제로 이동하는지 감시. 막힌 상황을 감지해 빠른 실패 처리를 한다.
    # =========================================================================
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # movement_time_allowance 동안 required_movement_radius 이상 이동하지
      # 않으면 "진행 없음(stuck)"으로 판정 → FollowPath goal 실패 반환.
      # 주차 목표 근처의 저속 미세 정렬을 stuck으로 오판하지 않도록
      # 20 s 동안 0.05 m 이상의 이동을 진행으로 인정한다.
      required_movement_radius: 0.05   # m
      movement_time_allowance:  20.0  # s

    # =========================================================================
    # goal_checker
    # 목표 지점(path 마지막 pose) 도달 여부를 판정한다.
    # =========================================================================
    goal_checker:
      stateful: true      # 한 번 도달 판정이 나면 속도와 무관하게 성공 유지
      plugin: "nav2_controller::SimpleGoalChecker"
      # GNSS RTK 오차 ~0.1 m 대비 충분한 허용 반경 설정.
      # 값이 너무 작으면 GNSS 오차로 인해 목표 도달을 못하는 상황 발생.
      xy_goal_tolerance:  0.5          # m  (수평 거리 오차 허용)
      yaw_goal_tolerance: 0.3          # rad (≈17°, 정밀 주차가 아닌 경로 추종용)

    # =========================================================================
    # first_parking_goal_checker
    # 1차 주차 goal은 최종 E goal보다 일찍 완료 처리해, base_link가
    # 목표를 통과하거나 목표 근처에서 과도하게 감속하는 현상을 방지한다.
    # =========================================================================
    first_parking_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance:  0.35         # m, base_link(후륜축) 기준
      yaw_goal_tolerance: 0.35         # rad (≈20°)

    # =========================================================================
    # parking_goal_checker
    # ParkingPath(후진 주차) 전용 goal checker.
    # RViz 화살표 직선 위에 차량이 정확히 위치하려면 yaw 오차를 엄격하게 제한해야 함.
    # ─ xy_goal_tolerance: gnss 오차. 너무 작으면 로컬라이제이션 오차로 인해 주차 성공 판정이 나지 않을 수 있음.
    # ─ yaw_goal_tolerance: 0.1 rad ≈ 6°. 화살표 방향과 차량 전면이 6° 이내로
    #   정렬되어야 성공 판정. (0.3 rad 허용 시 차가 선 위에서 크게 비틀릴 수 있음)
    # =========================================================================
    parking_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      # base_link(후륜축) 기준 20 cm, yaw 약 11.5° 이내에서 주차 완료
      xy_goal_tolerance:  0.20         # m
      yaw_goal_tolerance: 0.20         # rad (≈11.5°)

    # =========================================================================
    # PathHandler
    # 전체 경로(global path) 중 현재 위치 이후의 관련 구간만 잘라서 MPPI에 전달.
    # =========================================================================
    PathHandler:
      plugin: "nav2_controller::FeasiblePathHandler"
      # 이미 지나친 waypoint 는 prune_distance(m) 이상 뒤에 있으면 제거(pruning).
      # 값이 너무 작으면 약간의 오차에도 waypoint가 빠지고,
      # 너무 크면 이미 지난 구간을 계속 추종하려 할 수 있음.
      prune_distance: 5.0              # m
      enforce_path_inversion: false    # 후진 경로 강제 비활성화
      reject_unit_path: false          # 단일 waypoint 경로 허용

    # =========================================================================
    # FollowPath — MPPI Controller 플러그인
    # =========================================================================
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      # ── 경로 탐색 반경 ────────────────────────────────────────────────────
      # MPPI path_handler 가 경로 pose 를 탐색할 최대 반경.
      # 기본값: getMaxCostmapDist() = max(width,height)/2 = 10 m.
      # CSV 경로의 첫 waypoint 가 로봇 시작점(datum)에서 ~11.35 m 떨어져 있으므로
      # 기본값 10 m 으로는 0 poses 에러 발생 → 30 m 으로 확장.
      max_robot_pose_search_dist: 30.0    # m

      # ── MPPI 내부 경로 핸들러 ──────────────────────────────────────────────
      # controller_server 의 PathHandler 플러그인(FeasiblePathHandler)과 별개로,
      # MPPI optimizer 내부에도 독립적인 path_handler 가 존재하며 아래 파라미터를 읽는다.
      # prune_distance : 이미 지나친 waypoint 를 제거하는 기준 거리.
      #   FeasiblePathHandler.prune_distance(5.0 m)와 독립적으로 적용되므로
      #   두 값을 일치시켜 pruning 동작을 일관되게 유지하는 것이 권장됨.
      prune_distance: 5.0              # m  (기본값: 1.5 m)
      # transform_tolerance : MPPI path_handler 가 경로 좌표 변환 시 허용하는 TF 지연.
      #   소스 기본값 0.1 s → CARLA sim time TF 지연(최대 ~50 ms) 흡수에 여유가 부족.
      #   controller_server.transform_tolerance(0.5 s) 및 costmap 과 일치시킴.
      transform_tolerance: 0.5        # s  (기본값: 0.1 s → 0.5 s 로 상향)

      # ── 컨트롤러 리셋 주기 ───────────────────────────────────────────────
      # 마지막 computeVelocityCommands 호출로부터 이 시간(s) 이상 경과하면
      # MPPI 내부 최적 제어 시퀀스를 0으로 리셋.
      # 정지 → 재출발 시 이전 제어 명령 잔존으로 인한 급출발 방지.
      reset_period: 1.0               # s  (기본값: 1.0 s)

      # ── 예측 수평선 ───────────────────────────────────────────────────────
      # 예측 구간 = time_steps × model_dt
      #          = 40 × 0.1 s = 4.0 s
      # vx_max = 5 m/s 기준 4.0 s 동안 이동 거리 = 20 m → 충분한 예측 거리.
      # time_steps 증가 시: 더 긴 예측 → 급커브 사전 감지 가능, but 계산 증가.
      time_steps: 40
      # model_dt = 1 / controller_frequency (반드시 일치시킬 것)
      model_dt:   0.1                  # s  (변경: 0.05→0.1, controller_frequency 10Hz 기준)

      # ── 샘플 궤적 수 ──────────────────────────────────────────────────────
      # CPU 환경에서 1000~2000 적절. GPU 가속 시 4096 이상 권장.
      # 숫자가 클수록: 더 다양한 궤적 탐색 → 최적 궤적 품질 향상
      # 숫자가 작을수록: 계산 시간 단축 → 실시간 여유 확보
      batch_size: 1000

      # ── 닫힌루프 모드 ─────────────────────────────────────────────────────
      # false(닫힌루프): 각 time_step 마다 실제 차량 odometry를 반영해 롤아웃.
      #   CARLA 물리 엔진처럼 실제 피드백이 있는 환경에서는 false 권장.
      # true(열린루프): 차량 모델만으로 롤아웃, odometry 미반영. 빠르지만 부정확.
      open_loop: false

      # ── 가속도 한계 ───────────────────────────────────────────────────────
      # 주의: ax_max / ax_min / az_max 는 이 버전(Nav2 Humble 1.1.x)의 소스에
      # getParam 선언이 없어 실제로 읽히지 않는다 (파라미터를 넘겨도 무시됨).
      # 이 버전에서 후보 궤적의 속도는 vx_max / vx_min / wz_max 클리핑으로만 제한된다.
      # Iron 이상 버전에서는 유효할 수 있으므로 주석으로 보존.
      # ax_max:  2.0                   # m/s²  (최대 전방 가속도 — 이 버전 미지원)
      # ax_min: -3.0                   # m/s²  (최대 감속도 — 이 버전 미지원)
      # az_max:  1.5                   # rad/s² (최대 yaw 가속도 — 이 버전 미지원)

      # ── 탐색 노이즈 표준편차 ──────────────────────────────────────────────
      # 각 후보 궤적 제어 입력에 추가하는 가우시안 노이즈 크기.
      # vx_std: 속도 샘플링 폭. 너무 크면 속도 불안정, 너무 작으면 탐색 부족.
      # wz_std: 조향 샘플링 폭. 조향 진동(oscillation) 발생 시 0.2 이하로 감소.
      vx_std: 0.3                      # m/s
      wz_std: 0.3                      # rad/s

      # ── 속도 범위 ─────────────────────────────────────────────────────────
      # vx_max: 초기 테스트는 반드시 낮은 값(2.0~3.0)에서 시작.
      #   주행이 안정적으로 확인되면 단계적으로 높인다.
      # vx_min: 소폭 후진 허용 (경로 시작점 재접근 등).
      # wz_max: min_turning_r 과 물리적으로 일관되어야 함.
      #   wz_max = vx_max / min_turning_r = 5.0 / 3.3 ≈ 1.5 rad/s
      vx_max:  5.0                      # m/s  ← 처음엔 2.0으로 시작 권장
      # vx_min: 주차 후진 기동을 위해 -2.0으로 확장.
      # CSV 추종 중 불필요한 후진은 PreferForwardCritic이 억제하므로
      # 두 모드를 별도로 설정할 필요 없음.
      vx_min: -2.0                     # m/s  (변경: -0.5→-2.0, 주차 후진 허용)
      wz_max:  1.5                     # rad/s

      # ── MPPI 반복 횟수 ────────────────────────────────────────────────────
      # 1 제어 주기 안에서 최적화를 몇 번 수행할지.
      # 1: 실시간 성능 부족 환경 표준값.
      # 2~3: 계산 여유 있을 때 최적 궤적 품질 향상.
      iteration_count: 1

      # ── 탐색 실패 재시도 횟수 ────────────────────────────────────────────
      # 최적 궤적 탐색이 실패(유효 궤적 없음)했을 때 재시도 횟수.
      # 0: 실패 즉시 이전 제어 시퀀스를 재사용.
      # 1: 1회 재시도 후 실패 처리. 실패 빈도가 높으면 2 이상으로 높여볼 것
      #    (계산 시간 증가 주의).
      retry_attempt_limit: 1           # (기본값: 1)

      # ── temperature (중요 파라미터) ───────────────────────────────────────
      # MPPI의 softmax 가중치 날카로움 조절 (MPPI 알고리즘의 λ).
      # 낮을수록(→0): 최저 비용 궤적 하나에 집중 (greedy, 공격적).
      # 높을수록(→∞): 여러 궤적을 부드럽게 평균 (smooth, 보수적).
      # 도심 주행 시작값: 0.3.
      # 좁은 구간에서 진동 발생 시: 0.1~0.2로 낮춤.
      temperature: 0.3

      # ── gamma (discount factor) ───────────────────────────────────────────
      # 미래 단계 비용에 대한 할인율 (MPPI 논문의 γ).
      # 작을수록 먼 미래 비용을 덜 고려 (단기 최적화 우선).
      gamma: 0.015

      # ── 시각화 ───────────────────────────────────────────────────────────
      # true: /trajectories 토픽으로 모든 후보 궤적 발행 → RViz2 확인 가능.
      # 성능 부족 환경에서는 false 로 전환해 CPU 절약.
      # false: batch_size(1000) × time_steps(40) × 20Hz = 800,000 pose/s DDS 트래픽 차단
      visualize: true

      # ── 노이즈 재생성 ────────────────────────────────────────────────────
      # true: 매 제어 주기마다 새 노이즈 샘플 생성 (탐색 다양성 최대화).
      # false: 이전 노이즈 재사용 (계산 절약, but 탐색 다양성 감소).
      regenerate_noises: true

      # ── 운동 모델 ────────────────────────────────────────────────────────
      # "ackermann": 차량형(4륜 조향) 플랫폼 필수 설정.
      #   diff_drive 사용 시: 제자리 회전 등 실제 차량이 불가능한 궤적 허용 →
      #   cmd_vel 추종 불가, 차량 손상 위험.
      motion_model: "Ackermann"
      ackermann:
        plugin: "mppi::AckermannMotionModel"
        # 최소 회전반경 (m): MPPI가 생성하는 궤적의 곡률 상한을 결정.
        # 이 값보다 급격한 회전 궤적은 물리적으로 불가능하므로 폐기됨.
        #
        # microlino 실차 spec: 회전반경 ≈ 3.3 m
        # CARLA에서 측정 방법:
        #   1) 최대 조향각으로 원 주행
        #   2) ros2 topic echo /odometry/local 로 위치 궤적 기록
        #   3) 원의 반경 계산
        #
        # 값이 너무 작으면: MPPI가 물리적으로 불가능한 급선회 허용 → 실제 추종 불가
        # 값이 너무 크면: 급커브 구간에서 경로 이탈
        min_turning_r: 3.3             # m  ← CARLA 실측 후 반드시 수정

      # ── 궤적 검증기 ──────────────────────────────────────────────────────
      TrajectoryValidator:
        plugin: "mppi::DefaultOptimalTrajectoryValidator"
        collision_lookahead_time: 2.0  # s: 이 시간 안에 충돌 예측 시 궤적 폐기
        # false: 차량 중심점(point) 기반 충돌 체크 (빠름, 초기 테스트 권장)
        # true : 차량 footprint 기반 (정확하지만 계산 비용 높음)
        consider_footprint: false

      # ── 궤적 시각화 밀도 (visualize: true 일 때만 적용) ─────────────────
      # visualize: true 이면 /trajectories 토픽으로 후보 궤적을 발행한다.
      # batch_size(1000) × time_steps(40) 전부를 발행하면 DDS 트래픽이 크므로
      # 아래 step 값으로 렌더링 밀도를 줄여 RViz2 부하를 완화한다.
      TrajectoryVisualizer:
        # trajectory_step: 몇 번째 궤적마다 시각화할지. 1=전부, 5=5개 중 1개.
        trajectory_step: 5             # (기본값: 5)
        # time_step: 각 궤적에서 몇 번째 time step마다 점을 찍을지.
        time_step: 3                   # (기본값: 3)

      # =========================================================================
      # Critics — 후보 궤적에 비용을 부여하는 함수들
      # 각 Critic의 cost_weight 가 높을수록 해당 기준이 최적 궤적 선택에 강하게 영향.
      # 합산 비용이 가장 낮은 궤적이 cmd_vel 로 출력됨.
      # =========================================================================
      critics:
        [
          "ConstraintCritic",   # 물리 제약 위반 패널티
          "CostCritic",         # costmap 비용 기반 장애물 회피
          "GoalCritic",         # 목표 지점 접근 보상
          "GoalAngleCritic",    # 목표 지점 도달 시 heading 정렬
          "PathAlignCritic",    # 경로와 평행 주행 보상 (가장 중요)
          "PathFollowCritic",   # 경로 앞 waypoint 추적 보상
          "PathAngleCritic",    # 경로 방향과 heading 정렬
          "PreferForwardCritic",# 전진 선호 (후진 억제)
        ]

      # ConstraintCritic
      # 속도(vx_min~vx_max)·조향(wz_max) 범위를 벗어나는 궤적에 패널티.
      # cost_weight 높을수록 물리 제약을 항상 준수. 낮추면 경계선 궤적도 허용.
      ConstraintCritic:
        enabled: true
        cost_weight: 4.0
        cost_power: 1

      # GoalCritic
      # 예측 수평선 끝(time_steps 번째 pose)이 목표 지점과 가까울수록 낮은 비용.
      # threshold_to_consider: 목표 2.0 m 이내에서만 활성화.
      #   (멀리 있을 때는 PathFollowCritic이 경로 추종을 담당)
      GoalCritic:
        enabled: true
        cost_weight: 5.0
        cost_power: 1
        threshold_to_consider: 2.0    # m: 목표 2.0 m 이내에서만 활성화

      # GoalAngleCritic
      # 목표 지점 최종 접근 시 차량 heading을 목표 pose 방향으로 정렬.
      # threshold_to_consider: 매우 가까운 거리(1.0 m)에서만 활성화.
      GoalAngleCritic:
        enabled: true
        cost_weight: 3.0
        cost_power: 1
        threshold_to_consider: 1.0    # m
        # true : 목표 yaw 오차의 부호(좌/우)를 구분하지 않고 절대값으로만 평가.
        # false: 경로 방향에 따라 yaw 오차 부호를 구분 (기본값, 방향성 있는 정렬).
        symmetric_yaw_tolerance: false

      # PathAlignCritic (가장 중요한 critic)
      # 궤적이 전체 경로와 평행하게 달릴수록 낮은 비용.
      # cost_weight: 14.0 — 다른 critic 중 가장 높음 → 경로 이탈 방지 최우선.
      # max_path_occupancy_ratio: 경로 waypoint의 이 비율 이상이 costmap
      #   장애물 안에 있으면 이 critic 비활성화 (경로 자체가 장애물과 겹친 경우).
      # trajectory_point_step: 궤적 평가 시 이 간격으로 샘플링 (계산 절약).
      PathAlignCritic:
        enabled: true
        cost_weight: 14.0
        cost_power: 1
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false

      # PathFollowCritic
      # 경로상 현재 위치 앞의 waypoint를 향해 이동할수록 낮은 비용.
      # offset_from_furthest: MPPI 예측 구간 내에서 도달 가능한 가장 먼
      #   waypoint에서 5번째 앞 waypoint를 추적 목표로 설정.
      #   값을 높이면(8~10) 더 먼 waypoint 추적 → 빠른 진행.
      #   값을 낮추면(3~4) 더 가까운 waypoint 추적 → 느리지만 정밀.
      PathFollowCritic:
        enabled: true
        cost_weight: 5.0
        cost_power: 1
        offset_from_furthest: 5

      # PathAngleCritic
      # 경로 방향(waypoint-to-waypoint heading)과 차량 heading 을 정렬.
      # 급커브 진입 전에 차량을 미리 회전시키는 효과.
      # max_angle_to_furthest: 이 각도 이상 경로 방향이 틀어지면 비활성화.
      # forward_preference: true → 전진 방향 heading 선호.
      PathAngleCritic:
        enabled: true
        cost_weight: 2.0
        cost_power: 1
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.2    # rad (≈69°)
        forward_preference: true

      # PreferForwardCritic
      # 후진보다 전진 궤적을 선호.
      # 후진이 전혀 필요 없는 환경에서는 cost_weight를 높여 후진 완전 억제 가능.
      PreferForwardCritic:
        enabled: true
        cost_weight: 5.0
        cost_power: 1
        threshold_to_consider: 0.5   # m: 이 거리 이상 목표가 있을 때만 활성화

      # CostCritic
      # 각 후보 궤적이 지나는 costmap 셀 비용을 합산해 장애물 근처 궤적에 패널티.
      # lidar_2d obstacle_layer + inflation_layer 결과가 이 critic에 반영됨.
      #
      # collision_cost: 충돌(LETHAL_OBSTACLE) 셀 통과 궤적에 부여하는 큰 패널티.
      #   매우 높게 설정해 충돌 궤적이 절대 선택되지 않도록 함.
      # critical_cost: INSCRIBED_INFLATED_OBSTACLE(차량 중심이 장애물 외곽선 위) 패널티.
      # consider_footprint: true → costmap footprint 기반 충돌 체크. 차량 실제 형태 반영.
      # near_goal_distance: 목표 지점 이 거리 이내에서는 CostCritic 비활성화.
      #   목표 지점 근처에서 costmap 비용으로 인한 정지 방지.
      CostCritic:
        enabled: true
        cost_weight: 3.81
        cost_power: 1
        consider_footprint: true
        collision_cost: 1000000.0
        critical_cost: 300.0
        near_goal_distance: 1.0

      # =========================================================================
      # 현재 미사용 Critics — critics 목록에 이름을 추가하면 활성화 가능
      # =========================================================================

      # TwirlingCritic
      # 불필요한 yaw 진동(twirling) 억제.
      # 코너에서 차량이 좌우로 흔들리거나 직선에서 사행 주행이 발생할 때 추가.
      # TwirlingCritic:
      #   enabled: true
      #   cost_power: 1
      #   cost_weight: 10.0            # (기본값: 10.0)

      # VelocityDeadbandCritic
      # 특정 속도 구간(deadband)을 회피하게 함.
      # 예: 0~0.05 m/s 저속 크리핑 방지, 또는 특정 속도에서 진동이 발생할 때.
      # deadband_velocities: [vx_deadband, vy_deadband, wz_deadband]
      # VelocityDeadbandCritic:
      #   enabled: true
      #   cost_power: 1
      #   cost_weight: 35.0            # (기본값: 35.0)
      #   deadband_velocities: [0.05, 0.0, 0.05]

      # ObstaclesCritic
      # CostCritic과 달리 costmap 셀 값을 직접 읽지 않고, 내부적으로
      # inflation 함수를 사용해 장애물 반발력(repulsion)을 계산하는 별도 critic.
      # CostCritic과 동시에 사용하면 장애물 회피가 이중으로 적용되므로 주의.
      # cost_scaling_factor / inflation_radius 는 costmap 설정 값과 일치시킬 것.
      # ObstaclesCritic:
      #   enabled: true
      #   cost_power: 1
      #   repulsion_weight: 1.5        # 장애물 반발력 가중치 (기본값: 1.5)
      #   critical_weight: 20.0        # 차량 외곽선 내 진입 패널티 (기본값: 20.0)
      #   collision_cost: 10000.0      # 충돌 셀 통과 패널티 (기본값: 10000.0)
      #   collision_margin_distance: 0.1  # m: 이 거리 이내 접근 시 collision 판정
      #   near_goal_distance: 0.5      # m: 목표 지점 이내에서 비활성화
      #   consider_footprint: false
      #   cost_scaling_factor: 3.0     # costmap inflation_layer.cost_scaling_factor 와 맞출 것
      #   inflation_radius: 1.5        # m  costmap inflation_layer.inflation_radius 와 맞출 것

    # =========================================================================
    # ParkingPath — 주차 전용 MPPI Controller 플러그인
    # RViz "2D Goal Pose" 클릭 → 주차 시 이 플러그인이 사용됨.
    # 주차 모드에서는 정지(vx=0) 또는 후진(vx<0)만 허용한다.
    # planner에서도 DUBIN 경로를 반대로 계획한 뒤 뒤집어 후진 경로를 만든다.
    # PreferForwardCritic는 사용하지 않아 후진 궤적에 패널티를 부여하지 않는다.
    # 나머지 파라미터는 FollowPath 와 동일.
    # =========================================================================
    ParkingPath:
      plugin: "nav2_mppi_controller::MPPIController"

      max_robot_pose_search_dist: 30.0

      prune_distance: 5.0
      transform_tolerance: 0.5
      reset_period: 1.0

      time_steps: 40
      model_dt:   0.1
      batch_size: 1000
      open_loop: false

      # 전진 금지: 정지는 허용하되 양의 vx는 생성할 수 없다.
      vx_max:  0.0                     # m/s  (주차 모드 전진 금지)
      vx_min: -2.0                     # m/s  (최대 후진 속도)
      wz_max:  1.5                     # rad/s

      vx_std: 0.3
      wz_std: 0.3

      iteration_count: 1
      retry_attempt_limit: 1
      temperature: 0.3
      gamma: 0.015
      visualize: true
      regenerate_noises: true

      motion_model: "Ackermann"
      ackermann:
        plugin: "mppi::AckermannMotionModel"
        min_turning_r: 3.3

      TrajectoryValidator:
        plugin: "mppi::DefaultOptimalTrajectoryValidator"
        collision_lookahead_time: 2.0
        consider_footprint: false

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      critics:
        [
          "ConstraintCritic",
          "CostCritic",
          "GoalCritic",
          "GoalAngleCritic",
          "PathAlignCritic",
          "PathFollowCritic",
          "PathAngleCritic",
          "VelocityDeadbandCritic",
          # PreferForwardCritic 미사용 — 후진 패널티 제거
        ]

      ConstraintCritic:
        enabled: true
        cost_weight: 4.0
        cost_power: 1

      # GoalCritic
      # 최종 목표 위치로 강하게 끌어당긴다.
      # threshold_to_consider 를 3.0 m 로 확장해 일찍부터 목표 방향으로 수렴 유도.
      GoalCritic:
        enabled: true
        cost_weight: 10.0            # 5.0 → 10.0: 위치 끌어당기는 힘 강화
        cost_power: 1
        threshold_to_consider: 3.0   # 2.0 → 3.0 m: 더 멀리서부터 활성화

      # GoalAngleCritic
      # 목표 heading 으로 차량을 정렬하는 가장 중요한 critic.
      # cost_weight 를 높여 최종 접근 시 yaw 정렬을 최우선으로 만든다.
      # threshold_to_consider 를 확장해 2.5 m 이전부터 heading 교정 시작.
      GoalAngleCritic:
        enabled: true
        cost_weight: 8.0             # 3.0 → 8.0: heading 정렬 강도 대폭 강화
        cost_power: 1
        threshold_to_consider: 2.5   # 1.0 → 2.5 m: 훨씬 일찍 heading 교정 시작
        symmetric_yaw_tolerance: false

      # PathAlignCritic
      # use_path_orientations: true — 뒤집은 DUBIN 경로 waypoint의 차량 heading
      # 을 위치뿐 아니라 방향까지 반영해 평가 → 후진 경로에서 heading 추종 정밀도 향상.
      PathAlignCritic:
        enabled: true
        cost_weight: 14.0
        cost_power: 1
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: true  # false → true: 경로 waypoint orientation 도 평가에 반영

      PathFollowCritic:
        enabled: true
        cost_weight: 5.0
        cost_power: 1
        offset_from_furthest: 5

      # PathAngleCritic — cost_weight 상향으로 경로 방향 추종 강화
      PathAngleCritic:
        enabled: true
        cost_weight: 4.0             # 2.0 → 4.0: 경로 방향 추종 강화
        cost_power: 1
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.2
        # forward_preference: false 로 설정해 후진 경로 방향 정렬 허용
        forward_preference: false

      # 목표 직전에서 후진 속도가 과도하게 떨어지는 크리핑 억제.
      # 절대 vx가 0.25 m/s보다 작은 궤적에 비용을 부여하며,
      # goal checker가 허용 반경에서 FollowPath를 성공 종료하면 0으로 정지한다.
      VelocityDeadbandCritic:
        enabled: true
        cost_power: 1
        cost_weight: 35.0
        deadband_velocities: [0.25, 0.0, 0.0]

      CostCritic:
        enabled: true
        cost_weight: 3.81
        cost_power: 1
        consider_footprint: false
        collision_cost: 1000000.0
        critical_cost: 300.0
        near_goal_distance: 1.0


# =============================================================================
# follow_path_client — 주차 경로 실행 및 시각화
# =============================================================================
follow_path_client:
  ros__parameters:
    # RViz 경로 발행 스위치. 경로 계산/추종 동작에는 영향을 주지 않는다.
    parking_path_visualization_enabled: true
    parking_path_raw_topic: /parking_path/smac_reverse
    parking_path_final_topic: /parking_path/final_reverse
    parking_path_exit_straight_topic: /parking_path/exit_straight
    parking_path_exit_topic: /parking_path/exit_forward

    # zone_scan이 Zone1 Gate A 중앙 또는 Zone2 Gate B 지정점을 저장한다.
    parking_exit_goal_topic: /parking_exit/goal_utm
    parking_exit_zone_topic: /parking_exit/zone
    exit_straight_path_step: 0.2

    # ParkingZone1의 1차 주차 성공 후에만 UTM E 목표까지 N 고정 직선 후진.
    # ParkingZone2는 이 단계를 생략하고 Gate B 출차로 바로 전환한다.
    final_reverse_easting: 417069.41
    final_reverse_path_step: 0.2


# =============================================================================
# local_costmap
#
# 차량 주변 장애물 격자 지도. MPPI가 CostCritic을 통해 이 costmap을 참조해 장애물 회피.
# =============================================================================
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true

      # ── 갱신 주파수 ───────────────────────────────────────────────────────
      # LiDAR 발행 주파수(20 Hz)의 절반으로 설정.
      # 너무 높으면 CPU 부하 급증; 너무 낮으면 장애물 감지 지연.
      update_frequency:  10.0          # Hz
      publish_frequency: 10.0          # Hz

      # ── 기준 프레임 ───────────────────────────────────────────────────────
      # local costmap은 odom 프레임 기준.
      # MPPI가 odom 프레임에서 궤적을 롤아웃하므로 반드시 일치시킬 것.
      global_frame: odom
      robot_base_frame: base_link

      # footprint: global_costmap 과 동일한 차량 실제 형태. base_link(후륜축 중심) 기준(m).
      footprint: "[[2.1, 0.74], [2.1, -0.74], [-0.4, -0.74], [-0.4, 0.74]]"

      # ── 롤링 창 ──────────────────────────────────────────────────────────
      # true: 차량 중심으로 창이 이동 (local costmap 표준 설정).
      rolling_window: true

      # ── 지도 크기 및 해상도 ───────────────────────────────────────────────
      # 20 m × 20 m: vx_max=5 m/s, time_steps=56, model_dt=0.05 s
      #   → 예측 거리 = 14 m → 20 m는 전방 후방 여유 포함 적정 크기.
      # 0.1 m/cell: lidar_2d 정밀도(≈0.05 m)의 2배 → 충분한 해상도.
      width:       20                  # m
      height:      20                  # m
      resolution:   0.1                # m/cell  (200 × 200 격자)

      # ── TF 지연 허용 ────────────────────────────────────────────────────
      # controller_server도 costmap의 이 값을 그대로 사용한다
      # (controller_server.cpp: costmap_ros_->getTransformTolerance()).
      # 0.3 → 0.5: CARLA 렉으로 TF가 최대 50ms 지연될 때 충분한 여유 확보.
      transform_tolerance: 0.5         # s

      # ── 레이어 목록 ────────────────────────────────────────────────────
      plugins: ["obstacle_layer", "inflation_layer"]

      # ── obstacle_layer ────────────────────────────────────────────────
      # LiDAR 포인트 클라우드를 읽어 장애물 격자 생성.
      # 매 LiDAR 스캔마다 두 작업을 동시 수행:
      #   ① marking   : 포인트 위치 셀 → LETHAL_OBSTACLE(254) 마킹
      #   ② clearing  : 센서→포인트 광선 경로 셀 → FREE_SPACE(0) 클리어
      # LiDAR FOV 밖으로 사라진 장애물은 레이캐스팅이 닿지 않아 costmap에 잔류.
      # rolling_window 이동으로 자연 소멸됨.
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: false
        observation_sources: lidar_2d

        lidar_2d:
          # stack.json 에 정의된 lidar_2d 센서 토픽.
          # 채널 수: 1 (수평 2D scan), range: 20 m, 주파수: 20 Hz
          topic: /carla/car/lidar_2d/point_cloud
          data_type: PointCloud2

          # 2D LiDAR → 높이 정보 없음.
          # 모든 포인트가 단일 수평면에 있으므로 max/min 을 넓게 설정.
          max_obstacle_height: 2.0     # m  (이 높이 이하 포인트만 마킹)
          min_obstacle_height: 0.0     # m  (음수 설정 시 지면 반사 노이즈 흡수)

          # clearing: 센서→포인트 광선 경로를 FREE_SPACE 로 클리어.
          #   이동 장애물 잔류 방지 핵심 옵션. false 로 끄면 이미 지나간
          #   장애물 흔적이 costmap에 계속 남아 MPPI 오동작 유발.
          # marking:  포인트 위치를 LETHAL_OBSTACLE(254) 로 마킹.
          clearing: true
          marking:  true

          # raytrace_max_range: 이 거리까지 레이캐스팅으로 빈 공간을 클리어.
          #   lidar 유효 range 보다 2 m 작게 설정 (range 경계 노이즈 방지).
          # obstacle_max_range: 이 거리 이상 포인트는 장애물로 마킹 안 함.
          #   반드시 raytrace_max_range 보다 작게 유지:
          #   마킹 범위 > 레이캐스팅 범위이면 클리어 안 된 셀에 마킹 잔류.
          raytrace_max_range: 18.0     # m  (lidar 20 m 기준, 2 m 여유)
          obstacle_max_range: 15.0     # m  (raytrace 보다 3 m 작게)

      # ── inflation_layer ───────────────────────────────────────────────
      # 장애물 격자 주변으로 비용 그라디언트를 생성해 MPPI(CostCritic)에
      # 안전 여유 공간을 부여한다.
      #
      # 셀 비용 값 규격:
      #   0          = FREE_SPACE     (완전 자유)
      #   1 ~ 252    = 팽창 구역      (거리에 따른 지수 감쇠)
      #   253        = INSCRIBED      (차량 중심이 장애물 외곽선에 닿는 지점)
      #   254        = LETHAL         (실제 장애물 셀)
      #
      # 비용 계산 공식:
      #   cost(d) = 252 × exp(−cost_scaling_factor × (d − robot_radius))
      #   d: 장애물까지 거리 (m), 적용 범위: robot_radius < d ≤ inflation_radius
      #
      # 수치 예시 (robot_radius=1.5, cost_scaling_factor=3.0, inflation_radius=2.5):
      #   d=1.5 m (robot_radius 경계) → 253 (INSCRIBED)
      #   d=1.6 m                     → 252 × e^(−3.0×0.1) ≈ 187
      #   d=1.8 m                     → 252 × e^(−3.0×0.3) ≈ 103
      #   d=2.0 m                     → 252 × e^(−3.0×0.5) ≈  56
      #   d=2.5 m (inflation_radius)  → ≈ 0   (FREE)
      #
      # RViz2 costmap 색상 의미:
      #   파란색 계열 (0)       = 자유 공간
      #   하늘~초록 (1~127)    = 팽창 저비용
      #   노란~주황 (128~252)  = 팽창 고비용
      #   빨간색 (253)          = INSCRIBED
      #   흰색/보라 (254)       = LETHAL (실제 장애물)
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"

        # inflation_radius: 장애물에서 비용이 팽창되는 최대 반경.
        # 계산 근거: microlino 차폭(1.475 m) / 2 + 안전 여유(0.76 m) ≈ 1.5 m
        # 이 값이 robot_radius 와 같으면 팽창 구역 없이 INSCRIBED만 존재.
        # 올리면: MPPI가 장애물을 더 넓게 회피 (안전하지만 좁은 통로 통과 불가)
        # 낮추면: 좁은 통로 통과 가능; 충돌 여유 감소
        inflation_radius: 1.5          # m  ← 차량 폭 기준으로 조정 필요

        # cost_scaling_factor: 거리에 따른 비용 감소 속도 (지수 감쇠 계수 λ).
        # 높을수록: 비용이 가파르게 감소 → 장애물 바로 옆만 고비용 (좁은 회피 구역)
        # 낮을수록: 비용이 완만하게 감소 → 멀리서부터 고비용 (넓은 회피 구역)
        # 예) 장애물에서 2.0 m 떨어진 셀의 비용 (robot_radius=1.5):
        #   cost_scaling_factor=1.0 → 252 × e^(−0.5) ≈ 153 (고비용 구역 넓음)
        #   cost_scaling_factor=3.0 → 252 × e^(−1.5) ≈  56 (현재)
        #   cost_scaling_factor=6.0 → 252 × e^(−3.0) ≈  13 (장애물 근처만 고비용)
        cost_scaling_factor: 3.0

      # RViz2 에서 costmap을 실시간으로 확인하려면 true 로 유지.
      # false: 변경된 셀만 발행 → costmap 10Hz 발행 부하 대폭 감소
      always_send_full_costmap: true

# =============================================================================
# planner_server
# RViz "2D Goal Pose" 클릭 → /goal_pose (PoseStamped) → 모드 매니저가 수신
# → ComputePathToPose action 호출 → 주차 경로 계산
# → FollowPath action 으로 controller_server(MPPI) 에 전달
# =============================================================================
planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"

      # ── 운동 모델 ──────────────────────────────────────────────────────────
      # DUBIN으로 주차 목표 → 현재 위치의 전진 경로를 계획한 뒤,
      # mode_manager가 pose 순서를 뒤집어 전 구간 후진 경로로 사용한다.
      # DUBIN은 원본 경로에 후진 cusp가 생기지 않으므로, 뒤집은 경로도
      # 전진 구간 없이 후진으로만 구성된다.
      motion_model_for_search: "DUBIN"

      # ── Ackermann 최소 회전반경 ────────────────────────────────────────────
      # MPPI ackermann.min_turning_r 과 반드시 일치시킬 것.
      minimum_turning_radius: 3.3      # m  (microlino 기준)

      # ── 탐색 각도 해상도 ───────────────────────────────────────────────────
      # yaw 를 몇 단계로 분할할지. 72 = 5° 간격.
      # 높일수록 주차 heading 이 정밀해지지만 탐색 시간 증가.
      angle_quantization_bins: 72

      # ── 탐색 비용 가중치 ───────────────────────────────────────────────────
      # reverse_penalty   : 후진 구간에 부여하는 비용. 높을수록 후진 최소화.
      # change_penalty    : 전진↔후진 방향 전환 비용. 높을수록 전환 횟수 감소.
      # non_straight_penalty: 직선 대비 곡선 비용. 높을수록 직선 경로 선호.
      # cost_penalty      : costmap 비용 반영 강도.
      reverse_penalty: 2.0
      change_penalty: 0.5
      non_straight_penalty: 1.2
      cost_penalty: 2.0

      # ── 경로 스무딩 ────────────────────────────────────────────────────────
      smooth_path: true

      # ── 목표 도달 허용 오차 ────────────────────────────────────────────────
      # 작을수록 정밀 주차. 단, 너무 작으면 탐색 실패 가능성 증가.
      tolerance: 0.25                  # m

      # ── 최종 진입 방향 강제 ────────────────────────────────────────────────
      # true: RViz 에서 지정한 방향(yaw)으로 주차 공간에 정확히 진입.
      use_final_approach_orientation: true

      # ── 탐색 반경 ─────────────────────────────────────────────────────────
      # 탐색 시작점에서 이 반경 이내 경로만 탐색. 주차 구간이 넓으면 확장.
      max_planning_time: 5.0           # s: 이 시간 내에 경로 못 찾으면 실패

# =============================================================================
# global_costmap
# planner_server(SmacPlannerHybrid) 가 주차 경로를 계산할 때 사용하는 전역 장애물 지도.
#
# local_costmap 과의 차이:
#   local_costmap : MPPI 가 매 제어 주기(100 ms)마다 장애물 회피에 사용.
#                   rolling window, 20 m × 20 m, 10 Hz 갱신.
#   global_costmap: planner_server 가 경로 계산 시 1회 참조.
#                   rolling window, 넓은 범위, 2 Hz 갱신으로 충분.
#
# global_frame = map 이유:
#   CSV 경로 및 주차 목표(goal_pose) 가 map 프레임으로 발행되므로 플래너가 같은 프레임에서 경로를 탐색해야 좌표 변환 없이 일관성 유지.
#   RViz 에서 "2D Goal Pose" 클릭 시 Fixed Frame 이 map 이어야 goal_pose.header.frame_id = "map" 으로 발행되어 TF 변환 실패를 방지.
#
# 정적 지도(map_server) 없이 실시간 LiDAR와 ParkingZone ROI 테두리를 사용한다.
# 열린 입구를 제외한 3면 테두리가 lethal obstacle로 마킹되므로 Smac 경로가
# 정의된 주차영역 벽을 넘어가지 않는다.
# =============================================================================
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true

      # planner_server 는 global_costmap 기준 좌표계에서 경로를 탐색한다.
      # RViz Fixed Frame 이 이 값과 다르면 goal_pose TF 변환 실패 → 경로 계산 실패.
      global_frame: map
      robot_base_frame: base_link

      # 경로 계산은 주차 요청 시 1회만 수행되므로 갱신 주기가 낮아도 됨.
      # 2 Hz 갱신: 주차 요청 직전 최신 LiDAR 스캔 1~2회를 반영.
      update_frequency: 2.0            # Hz
      publish_frequency: 1.0           # Hz

      # rolling_window: true — costmap 원점이 로봇 중심을 따라 이동.
      # false 로 설정하면 원점이 map (0,0) 에 고정되어 로봇이 맵 바깥에 위치함.
      rolling_window: true

      # 맵 크기: 주차 기동에 필요한 탐색 거리를 충분히 커버해야 함.
      # SmacPlannerHybrid 의 max_planning_time(5 s) 동안 탐색하는 최대 반경 기준.
      # 200 m × 200 m @ 0.2 m/cell = 1000 × 1000 셀.
      # 주차 목표가 현재 위치에서 멀리 있으면(예: 50 m 이상) 크기를 늘릴 것.
      width:      200                  # m
      height:     200                  # m
      resolution:   0.2                # m/cell  (local의 0.1 m보다 거칠어도 됨)

      # TF 지연 허용 (local_costmap 과 동일하게 유지)
      transform_tolerance: 0.5         # s

      # footprint: 차량 실제 형태를 다각형으로 지정. base_link(후륜축 중심) 기준 좌표(m).
      # microlino: 전장 2.52 m, 전폭 1.475 m, 후륜축 기준
      #   전방(앞범퍼): +2.1 m  /  후방(뒷범퍼): −0.4 m  /  좌우: ±0.74 m
      # ※ CARLA 실측 치수로 검증 후 조정 권장.
      footprint: "[[2.1, 0.74], [2.1, -0.74], [-0.4, -0.74], [-0.4, 0.74]]"

      # Scan 중에만 중계되는 LiDAR와 ROI 테두리를 obstacle layer에 반영한다.
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: lidar_2d zone_scan_roi_boundary
        lidar_2d:
          # zone_scan이 /parkingScan=true일 때만 원본 LiDAR를 중계한다.
          topic: /zone_scan/cost_lidar_points
          data_type: PointCloud2
          # 2D LiDAR 는 높이 정보 없음 → 수직 범위를 넓게 설정해 모든 포인트 수용.
          max_obstacle_height: 2.0     # m
          min_obstacle_height: 0.0     # m
          # clearing: 레이캐스팅으로 포인트 없는 방향을 FREE_SPACE 로 클리어.
          # marking:  LiDAR 포인트 위치를 LETHAL_OBSTACLE 로 마킹.
          # 둘 다 true 여야 이동하는 장애물도 실시간으로 갱신됨.
          clearing: true
          marking: true
          # raytrace_max_range: 이 거리까지 레이캐스팅 적용 (빈 공간 클리어).
          #   lidar 유효 range(약 20 m) 보다 2~5 m 작게 설정하는 것이 권장.
          # obstacle_max_range: 이 거리 이상의 포인트는 장애물로 마킹 안 함.
          #   raytrace_max_range 보다 반드시 작게 유지 (빈공간 클리어 > 마킹 범위).
          raytrace_max_range: 18.0     # m
          obstacle_max_range: 15.0     # m

        # ParkingZone의 열린 입구를 제외한 3면 ROI 테두리를
        # LETHAL_OBSTACLE로 마킹한다. cloud가 map frame이므로 별도 TF 변환 없이
        # SmacPlannerHybrid가 정의된 주차영역 외벽을 직접 회피한다.
        zone_scan_roi_boundary:
          topic: /zone_scan/roi_boundary_points
          data_type: PointCloud2
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          marking: true
          clearing: false
          # map 원점을 sensor origin으로 보므로 200m rolling costmap 전체를
          # 포함할 수 있도록 원본 LiDAR보다 충분히 크게 설정한다.
          obstacle_max_range: 300.0
          observation_persistence: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # local_costmap 과 동일한 팽창 설정 유지.
        # planner 가 장애물 주변으로 여유 경로를 탐색하게 함.
        # 팽창 비용 공식: cost(d) = 252 × exp(−cost_scaling_factor × (d − robot_radius))
        inflation_radius: 1.5          # m  (local_costmap 과 동일)
        cost_scaling_factor: 3.0       # (local_costmap 과 동일)

      # false: 변경된 셀만 발행 → global_costmap 트래픽 절약.
      # (global_costmap 은 RViz 시각화 우선순위가 낮으므로 false 권장)
      always_send_full_costmap: false
