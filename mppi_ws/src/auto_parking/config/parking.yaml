parking:
  ros__parameters:
    parking_mode_topic: /parkingMode
    point_goal_topic: /point_parking/goal_pose
    point_goal_valid_topic: /point_parking/goal_valid
    datum_topic: /utm_datum

    # dual_filter mode_manager가 구독하는 Nav2 주차 목표 토픽
    # Point Parking 목표임을 구분해, 1차 주차 완료 후
    # UTM E=417069.41 직선 후진 단계를 실행한다.
    output_goal_topic: /point_parking/nav_goal

    # Point Parking goal은 절대 UTM, Nav2 planner/MPPI는 map 기준을 사용한다.
    utm_frame_id: utm
    map_frame_id: map
